# Apache HTTPD virtual host + reverse proxy + load balancer
# Ubuntu: save as /etc/apache2/sites-available/shop.conf
#         sudo a2ensite shop && sudo apachectl configtest && sudo systemctl reload apache2
# Modules: sudo a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests ssl headers rewrite

<VirtualHost *:80>
    ServerName shop.example.local
    DocumentRoot /var/www/shop

    <Directory /var/www/shop>
        Options -Indexes +FollowSymLinks
        # allow .htaccess files to override settings
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse proxy /api to an app server
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/shop_error.log
    CustomLog ${APACHE_LOG_DIR}/shop_access.log combined
</VirtualHost>

# Load balancer
<Proxy "balancer://appcluster">
    BalancerMember "http://10.0.0.11:8080"
    BalancerMember "http://10.0.0.12:8080"
    ProxySet lbmethod=byrequests
</Proxy>

<VirtualHost *:80>
    ServerName app.example.local
    ProxyPass        "/" "balancer://appcluster/"
    ProxyPassReverse "/" "balancer://appcluster/"
</VirtualHost>

