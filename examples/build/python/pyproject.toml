# Modern Python packaging.
#   pip install build
#   python -m build          -> dist/demo_app-1.0.0-py3-none-any.whl + .tar.gz
#   twine upload --repository-url http://nexus.example.local:8081/repository/pypi-internal/ dist/*

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-app"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0,<4",
  "gunicorn>=22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
