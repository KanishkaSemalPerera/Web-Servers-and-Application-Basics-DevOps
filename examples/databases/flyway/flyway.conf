# Flyway config (Flyway also reads FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD env vars - prefer those in CI)
#   flyway info       # what is applied / pending
#   flyway migrate    # apply pending migrations
#   flyway validate   # checksums of applied files still match?
#   flyway repair     # fix the history table after a failed migration

flyway.url=jdbc:postgresql://localhost:5432/appdb
flyway.user=app
flyway.locations=filesystem:sql
flyway.baselineOnMigrate=true
# password: set FLYWAY_PASSWORD in the environment, never commit it
