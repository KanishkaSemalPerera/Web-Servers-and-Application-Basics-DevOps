# /etc/haproxy/haproxy.cfg
# Test:   haproxy -c -f /etc/haproxy/haproxy.cfg
# Reload: sudo systemctl reload haproxy

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode    http
    log     global
    option  httplog
    option  forwardfor               # adds X-Forwarded-For
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Stats dashboard: http://<server>:8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

frontend http_in
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/site.pem   # pem = cert + key in one file
    # http-request redirect scheme https unless { ssl_fc }

    # Route by path (Layer 7)
    acl is_api path_beg /api
    use_backend api_servers if is_api
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 10.0.0.11:8080 check
    server web2 10.0.0.12:8080 check

backend api_servers
    balance leastconn
    option httpchk GET /health
    server api1 10.0.0.21:5000 check inter 2s fall 3 rise 2
    server api2 10.0.0.22:5000 check inter 2s fall 3 rise 2

