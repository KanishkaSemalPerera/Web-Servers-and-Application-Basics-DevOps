# Lab: Nginx load balancer in front of 3 tiny app containers.
#   docker compose up -d
#   for i in 1 2 3 4 5 6; do curl -s http://localhost:8080; done
#   docker compose stop app2        # watch traffic skip the dead server
#   docker compose down

services:
  app1:
    image: hashicorp/http-echo:1.0
    command: ["-text=Hello from app1", "-listen=:5678"]
  app2:
    image: hashicorp/http-echo:1.0
    command: ["-text=Hello from app2", "-listen=:5678"]
  app3:
    image: hashicorp/http-echo:1.0
    command: ["-text=Hello from app3", "-listen=:5678"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2, app3]
