# Mounted as /etc/nginx/conf.d/default.conf inside the nginx container.
# Docker's internal DNS resolves app1/app2/app3 to the container IPs.

upstream backend {
    # Try each one: comment/uncomment and run "docker compose restart nginx"
    # least_conn;
    # ip_hash;
    server app1:5678;
    server app2:5678;
    server app3:5678 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        add_header X-Upstream $upstream_addr always;   # which backend answered
    }

    location = /health {
        return 200 "ok\n";
    }
}
