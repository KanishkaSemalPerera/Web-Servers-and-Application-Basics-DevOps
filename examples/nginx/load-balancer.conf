# Load balance across app servers.

upstream app_backend {
    # Algorithm (pick ONE; default is round robin)
    # least_conn;
    # ip_hash;

    server 10.0.0.11:8080 weight=3;                 # bigger box, more traffic
    server 10.0.0.12:8080 max_fails=3 fail_timeout=30s;
    server 10.0.0.13:8080 max_fails=3 fail_timeout=30s;
    server 10.0.0.14:8080 backup;                   # only used if others are down

    keepalive 32;                                   # reuse connections to backends
}

server {
    listen 80;
    server_name app.example.local;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # If one backend errors, try the next one
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Simple health endpoint for an external load balancer
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
