# /etc/nginx/nginx.conf  - main config (trimmed, production-friendly defaults)

user  nginx;                      # Debian/Ubuntu use: www-data
worker_processes  auto;           # one worker per CPU core
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;     # max connections PER worker
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;          # hide nginx version in headers / error pages
    client_max_body_size 10m;     # max upload size

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Every site lives in its own file
    include /etc/nginx/conf.d/*.conf;
}
