# Nginx in front of an app running on port 3000 (Node, Python, Java...)

server {
    listen 80;
    server_name app.example.local;

    # Static files straight from disk (fast)
    location /static/ {
        alias /var/www/app/static/;
    }

    # Everything else goes to the app
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Only the API path, with the /api prefix STRIPPED (note both trailing slashes)
    #   /api/users  ->  http://127.0.0.1:5000/users
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
    }
}
