# HTTPS with Let's Encrypt certificates (created by: sudo certbot --nginx -d shop.example.com)

# 1) Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name shop.example.com;

    # Let certbot renew over HTTP
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# 2) The real HTTPS site
server {
    listen 443 ssl;
    http2 on;                      # nginx >= 1.25.1 (older: "listen 443 ssl http2;")
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: browsers will ONLY use https for 1 year (enable once https works!)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

# Self-signed cert for LOCAL testing only:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout selfsigned.key -out selfsigned.crt -subj "/CN=shop.example.local"
