# /etc/nginx/conf.d/static-site.conf
# Serve a plain HTML/CSS/JS website from disk.

server {
    listen 80;
    server_name example.local www.example.local;

    root  /var/www/example;
    index index.html;

    location / {
        # try the file, then a folder, else 404
        try_files $uri $uri/ =404;
    }

    # Long cache for hashed static assets (app.3f9a1c.js)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Never serve hidden files like .git or .env
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
