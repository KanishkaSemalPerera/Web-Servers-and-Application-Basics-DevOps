# Two websites on ONE server / ONE IP. Nginx picks by the Host header.

server {
    listen 80 default_server;       # catches requests that match no server_name
    server_name _;
    return 444;                     # close connection (drop unknown hosts)
}

server {
    listen 80;
    server_name shop.example.local;
    root /var/www/shop;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name blog.example.local;
    root /var/www/blog;
    location / { try_files $uri $uri/ =404; }
}

# Test locally without DNS:
#   curl -H "Host: shop.example.local" http://127.0.0.1/
#   curl -H "Host: blog.example.local" http://127.0.0.1/
